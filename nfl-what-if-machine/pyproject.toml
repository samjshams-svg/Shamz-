[project]
name = "nfl-what-if-machine"
version = "0.1.0"
description = "Rewrite a 2010-2019 NFL play, replay the game, and simulate how the next two seasons change"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
whatif = "whatif.cli:main"

[tool.setuptools]
packages = ["whatif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
